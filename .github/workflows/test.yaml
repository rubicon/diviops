# Fork-owned. Upstream ships no CI; see FORK.md.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin header declares "Requires PHP: 7.4", so the floor is linted too.
        # 8.5 is here because the reference dev site already runs it (runtime
        # drift -- see #72) -- production hosts are moving to it and CI must
        # exercise what actually ships, not lag behind by a version.
        php: ['7.4', '8.3', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # A linter that finds no files exits 0 and reads as a pass. Count first and
      # fail loudly on zero, so a broken glob can never masquerade as a clean run.
      - name: Lint every PHP file
        run: |
          count=$(find plugins -name '*.php' -type f | wc -l | tr -d ' ')
          echo "linting $count PHP file(s) under plugins/"
          if [ "$count" -lt 1 ]; then
            echo "::error::found no PHP files to lint. The glob is wrong; this is a blind gate, not a pass."
            exit 1
          fi
          find plugins -name '*.php' -type f -print0 | xargs -0 -n1 -P4 php -l

      # tests-live/ (#20) is opt-in and never executed here -- it needs a real
      # WordPress site and credentials CI doesn't have -- but a syntax check
      # needs neither, and its scripts should not be able to bit-rot unnoticed
      # between the rare manual runs that would otherwise be the only thing
      # to catch a typo.
      - name: Lint every live-suite PHP file (syntax only, never executed)
        run: |
          count=$(find tests-live -name '*.php' -type f | wc -l | tr -d ' ')
          echo "linting $count PHP file(s) under tests-live/"
          if [ "$count" -lt 1 ]; then
            echo "::error::found no PHP files to lint. The glob is wrong; this is a blind gate, not a pass."
            exit 1
          fi
          find tests-live -name '*.php' -type f -print0 | xargs -0 -n1 -P4 php -l

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      # The runner itself exits non-zero when it discovers no test files, so an
      # empty suite fails here rather than reporting a green PASS of zero assertions.
      - name: Run test suite
        run: php tests/run.php

  # A separate job, not a matrix leg of "Test suite" above (#72): that job's
  # exact name is a required status check in branch protection, and renaming
  # or matrix-parameterizing it would make that check permanently unsatisfiable
  # for every future PR the same way changing the CI matrix's node labels did
  # in #55 -- discovered the hard way once already this cycle, not repeating
  # it here. This job is purely additive.
  test-php85:
    name: Test suite (php 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Run test suite
        run: php tests/run.php

  server-security-test:
    name: diviops-server security tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares "engines.node": ">=18.0.0", so the floor is
        # tested alongside current LTS.
        node: ['18', '22']
    defaults:
      run:
        working-directory: diviops-server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      # Scoped to wp-cli.ts and wp-cli-fs-validator.ts (the WP-CLI command
      # allowlist and the filesystem path validator) via tsconfig.test.json,
      # not the project-wide "test" script — src/index.ts currently fails to
      # build for unrelated reasons (missing cross-env-preflight modules),
      # which would otherwise block this unrelated security suite from ever
      # running.
      - name: Run WP-CLI allowlist / filesystem path validator tests
        run: npm run test:server-security

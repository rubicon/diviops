# Fork-owned. Upstream ships no CI; see FORK.md.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin header declares "Requires PHP: 7.4", so the floor is linted too.
        # 8.5 is here because the reference dev site already runs it (runtime
        # drift -- see #72) -- production hosts are moving to it and CI must
        # exercise what actually ships, not lag behind by a version.
        php: ['7.4', '8.3', '8.5']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # A linter that finds no files exits 0 and reads as a pass. Count first and
      # fail loudly on zero, so a broken glob can never masquerade as a clean run.
      - name: Lint every PHP file
        run: |
          count=$(find plugins -name '*.php' -type f | wc -l | tr -d ' ')
          echo "linting $count PHP file(s) under plugins/"
          if [ "$count" -lt 1 ]; then
            echo "::error::found no PHP files to lint. The glob is wrong; this is a blind gate, not a pass."
            exit 1
          fi
          find plugins -name '*.php' -type f -print0 | xargs -0 -n1 -P4 php -l

      # tests-live/ (#20) is opt-in and never executed here -- it needs a real
      # WordPress site and credentials CI doesn't have -- but a syntax check
      # needs neither, and its scripts should not be able to bit-rot unnoticed
      # between the rare manual runs that would otherwise be the only thing
      # to catch a typo.
      - name: Lint every live-suite PHP file (syntax only, never executed)
        run: |
          count=$(find tests-live -name '*.php' -type f | wc -l | tr -d ' ')
          echo "linting $count PHP file(s) under tests-live/"
          if [ "$count" -lt 1 ]; then
            echo "::error::found no PHP files to lint. The glob is wrong; this is a blind gate, not a pass."
            exit 1
          fi
          find tests-live -name '*.php' -type f -print0 | xargs -0 -n1 -P4 php -l

  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      # The runner itself exits non-zero when it discovers no test files, so an
      # empty suite fails here rather than reporting a green PASS of zero assertions.
      - name: Run test suite
        run: php tests/run.php

  # A separate job, not a matrix leg of "Test suite" above (#72): that job's
  # exact name is a required status check in branch protection, and renaming
  # or matrix-parameterizing it would make that check permanently unsatisfiable
  # for every future PR the same way changing the CI matrix's node labels did
  # in #55 -- discovered the hard way once already this cycle, not repeating
  # it here. This job is purely additive.
  test-php85:
    name: Test suite (php 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Run test suite
        run: php tests/run.php

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # Dev-tooling only (#71) -- composer.json/composer.lock exist solely to
      # pin PHPStan + WordPress stubs for this job. The plugin itself ships
      # zero Composer dependencies at runtime; nothing here changes that.
      - name: Install PHPStan
        run: composer install --no-interaction --no-progress --prefer-dist

      # Scoped to plugins/diviops-agent (the security-sensitive PHP surface —
      # CodeQL's default setup does not cover PHP at all, see #71). Divi and
      # The SEO Framework's own symbols are ignored by exact message
      # (phpstan.neon.dist) since no redistributable stubs exist for either;
      # everything else pre-existing is captured in phpstan-baseline.neon so
      # this starts permissive rather than blocking on day one, per the
      # issue's own "start permissive, ratchet up" plan. Level and baseline
      # both live in phpstan.neon.dist, not duplicated here.
      - name: Run PHPStan
        # Runs the same composer script a developer runs locally, so the
        # memory limit cannot drift between here and a workstation (#125).
        run: composer phpstan -- --no-progress

  server-security-test:
    name: diviops-server security tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json declares "engines.node": ">=22.0.0", so the floor is
        # tested alongside current Active LTS (24 as of 2026-07 -- see
        # nodejs/Release's schedule.json; 22 itself entered maintenance-only
        # LTS on 2025-10-21 and both were confirmed still within their own
        # support windows when this was last checked).
        node: ['22', '24']
    defaults:
      run:
        working-directory: diviops-server
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      # Scoped to wp-cli.ts and wp-cli-fs-validator.ts (the WP-CLI command
      # allowlist and the filesystem path validator) via tsconfig.test.json,
      # not the project-wide "test" script. Originally scoped this way
      # because src/index.ts failed to build for unrelated reasons (missing
      # cross-env-preflight modules, fixed by #41); kept scoped regardless,
      # since a security-relevant allowlist suite has no reason to depend on
      # the rest of the server building.
      - name: Run WP-CLI allowlist / filesystem path validator tests
        run: npm run test:server-security

      # Plain ESM, no tsc involved, so it never depended on index.ts's build
      # either -- see #116.
      - name: Run regen-module-formats tests
        run: npm run test:regen-skill

      # The real build (not the scoped tsconfig.test.json above) plus an
      # actual `node dist/index.js` startup, asserting it reaches the
      # graceful missing-credentials refusal rather than crashing. #41
      # (ERR_MODULE_NOT_FOUND on the vendored cross-env-preflight modules)
      # and #128 (a missing _meta.idempotent declaration, masked by #41
      # until #41 was fixed) both only manifest when the server actually
      # runs as a process -- no prior job in this file exercised that.
      - name: Run server build + startup regression test (#41, #128)
        run: node --test scripts/verify-server-builds-and-starts.test.mjs

      # The registry-finalization test imports the built index.js, which needs
      # the vendored cross-env-preflight JS present -- so it runs against the
      # full `npm run build` output (copy-vendored included), not the scoped
      # dist-test lane above (#137).
      - name: Run CanonicalToolRegistry finalization test (#137)
        run: npm run build && node --test dist/__tests__/canonical-tool-registry-finalization.test.js

      # Same reason as the step above -- this one imports the built index.js
      # too, so it runs against the full build output rather than the scoped
      # dist-test lane. It asserts the MCP request's AbortSignal actually
      # reaches (read tools) or is deliberately withheld from (mutating tools)
      # the injected fetch (#134).
      - name: Run plugin-tool cancellation test (#134)
        run: node --test dist/__tests__/tool-cancellation.test.js

      # Same reason again -- it drives the real registered scf_field_group_*
      # handlers out of the built index.js, against a stub `wp` that replays a
      # polluted stdout fixture and exits 0. Listed explicitly because the
      # scoped dist-test lane excludes it (index.ts is outside that tsconfig),
      # so without this step nothing in CI would execute the assertions that
      # a parse failure never surfaces as not_found (#167).
      - name: Run SCF field-group stdout pollution test (#167)
        run: node --test dist/__tests__/scf-field-group-stdout-pollution.test.js

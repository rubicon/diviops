# Publish diviops-server to npm as @rubicontv/diviops-mcp (#163).
#
# Fires when a GitHub Release is published — release-please cuts the Release when
# its release PR merges — so npm never drifts behind the tags.
#
# CRITICAL: this repository cuts TWO release streams. release-please versions the
# WordPress plugin as `vX.Y.Z` and the MCP server as `mcp-server-vX.Y.Z`
# (`component: mcp-server`, `include-component-in-tag: true`). An unguarded
# `on: release: [published]` would therefore run `npm publish` on PLUGIN releases
# too, republishing an unchanged server under a version that does not exist. The
# tag-prefix guard below is the whole reason this file differs from the
# single-package template it was modeled on (rubicon/forgejo-mcp).
#
# `workflow_dispatch` allows an on-demand (re)publish — used for the first
# publish, whose release was cut before this workflow existed.
#
# Authenticates by TRUSTED PUBLISHING (OIDC), not a token. npmjs.com trusts this
# repository + this workflow filename for `@rubicontv/diviops-mcp`, so the job
# exchanges its GitHub OIDC identity for publish rights at run time and no npm
# credential exists in this repository to leak or rotate (#170).
#
# `id-token: write` is therefore REQUIRED, not optional — it is what mints the
# OIDC token. Provenance is implicit under trusted publishing, so the explicit
# `--provenance` flag is gone; attestations still appear on the published
# package.
#
# The trusted-publisher record on npmjs.com is keyed to the workflow FILENAME.
# Renaming this file silently breaks publishing until the npm setting is updated
# to match, and the failure is a permissions error at publish time, not a
# config error at parse time.
#
# Phase 1 (#163) bootstrapped with an `NPM_TOKEN` secret because OIDC cannot
# perform a package's FIRST publish. That token is retired; see #170 for the
# revocation step.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # mints the OIDC token trusted publishing authenticates with

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Only the mcp-server release train publishes. On workflow_dispatch there is
    # no release payload, so the maintainer's explicit invocation is trusted.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'mcp-server-v')
    defaults:
      run:
        working-directory: diviops-server
    steps:
      # SHA-pinned, not tagged (#200). This job holds `id-token: write`, which
      # under trusted publishing IS the publish credential, so it is the one
      # workflow where a mutable tag would let an upstream retag execute new
      # code with rights to push to the registry. These are
      # the same SHAs test.yaml uses, so the publish path runs action code this
      # repository's CI has already proven.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: diviops-server/package-lock.json
      - run: npm ci
      # Build + credential-free MCP handshake. Fails loudly on an empty registry,
      # a drifted tool count, a missing tool, or a version mismatch — so a broken
      # build cannot reach the registry.
      - run: npm run smoke
      - run: npm publish --access public
